
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>极速赛车自动预测助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#101827;color:#edf2f7;font-family:Arial,"Microsoft YaHei",sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;font-size:23px}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:18px}
.card{background:#1b293b;border:1px solid #304158;border-radius:13px;padding:14px;margin-bottom:13px}
h2{font-size:17px;margin:0 0 12px}
.status,.muted,.notice{font-size:12px;color:#a5b4c8;line-height:1.8}
.green{color:#4ade80}
.red{color:#fb7185}
.gold{color:#facc15}
.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.num{background:#26374e;border-radius:9px;text-align:center;padding:12px 2px;font-size:20px;font-weight:bold}
.num.first{background:#facc15;color:#241b00}
.num small{display:block;font-size:10px;font-weight:normal;margin-bottom:4px}
button{border:0;border-radius:9px;padding:12px 14px;font-size:14px;font-weight:bold;background:#3b82f6;color:white;margin:7px 3px 0 0}
button.secondary{background:#475569}
button.danger{background:#b45353}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#26374e;padding:12px 4px;border-radius:9px}
.stat strong{display:block;font-size:23px;color:#facc15}
.stat span{font-size:11px;color:#a5b4c8}
.history-item{padding:12px 0;border-bottom:1px solid #34445a}
.history-head{font-size:12px;color:#94a3b8;margin-bottom:7px}
.history-line{font-size:19px;font-weight:bold;letter-spacing:1px;word-break:break-word}
.prediction{font-size:14px;line-height:2}
.empty{color:#94a3b8;font-size:13px;padding:10px 0}
</style>
</head>
<body>
<div class="container">
<h1>极速赛车自动预测助手</h1>
<div class="sub">实时开奖 · 自动预测 · 自动保存</div>

<div class="card">
<h2>实时开奖数据</h2>
<div class="status" id="status">正在连接开奖数据……</div>
<div id="latest"></div>
<button onclick="refreshAll()">立即刷新</button>
<button class="secondary" onclick="window.open('https://m.1689687.com/html/jisusaiche/index.html','_blank')">打开原开奖网站</button>
</div>

<div class="card">
<h2>下一期单号预测</h2>
<div id="prediction" class="prediction">等待开奖数据……</div>
<div class="muted">根据最近读取到的开奖数据前三名出现次数统计，仅供参考。</div>
<div class="muted" id="autoSaveStatus">等待自动保存……</div>
</div>

<div class="card">
<h2>预测成绩统计</h2>
<div class="stats">
<div class="stat"><strong id="hitCount">0</strong><span>命中次数</span></div>
<div class="stat"><strong id="checkedCount">0</strong><span>已核对次数</span></div>
<div class="stat"><strong id="hitRate">0%</strong><span>命中率</span></div>
</div>
</div>

<div class="card">
<h2>最近20期历史开奖记录</h2>
<div class="muted" id="historyStatus">等待获取历史数据……</div>
<div id="historyList"></div>
</div>

<div class="card">
<h2>预测历史</h2>
<div id="predictionList"></div>
</div>

<div class="card">
<h2>数据管理</h2>
<button class="secondary" onclick="exportData()">导出数据备份</button>
<button class="danger" onclick="clearPredictions()">清空预测记录</button>
<div class="notice">记录保存在本机浏览器。清除浏览器数据或更换手机可能导致记录丢失，请定期备份。</div>
</div>

<div class="card">
<div class="notice">预测结果仅供参考，不保证开奖结果，也不构成投注建议。请与原开奖网站核对。</div>
</div>
</div>

<script>
const API='https://speedy10-data.lin-bei666ye.workers.dev/';
const RECORD_KEY='speedy10_single_records_v6';
const PRED_KEY='speedy10_single_predictions_v6';

let records=load(RECORD_KEY,[]);
let predictions=load(PRED_KEY,[]);
let nextIssue='';
let latestIssue='';
let refreshing=false;

function load(key,fallback){
  try{
    const v=JSON.parse(localStorage.getItem(key));
    return Array.isArray(v)?v:fallback;
  }catch(e){return fallback;}
}

function save(){
  localStorage.setItem(RECORD_KEY,JSON.stringify(records));
  localStorage.setItem(PRED_KEY,JSON.stringify(predictions));
}

function findDrawObject(value,depth=0){
  if(depth>10||!value||typeof value!=='object')return null;
  if(!Array.isArray(value)&&value.preDrawIssue!==undefined&&value.preDrawCode){
    return value;
  }
  const values=Array.isArray(value)?value:Object.values(value);
  for(const v of values){
    const found=findDrawObject(v,depth+1);
    if(found)return found;
  }
  return null;
}

function normalizeRecord(obj){
  if(!obj||typeof obj!=='object')return null;
  const issue=obj.preDrawIssue??obj.issue??obj.drawIssue??obj.period??obj.expect;
  const code=obj.preDrawCode??obj.drawCode??obj.openCode??obj.code??obj.numbers;
  if(issue===undefined||code===undefined)return null;
  const nums=Array.isArray(code)?code.map(Number):
    String(code).split(/[,，\s]+/).map(Number);
  if(nums.length!==10||nums.some(n=>!Number.isInteger(n)||n<1||n>10))return null;
  return {issue:String(issue),numbers:nums};
}

function findRecords(value,out=[],depth=0){
  if(depth>10||value==null)return out;
  if(Array.isArray(value)){
    value.forEach(v=>findRecords(v,out,depth+1));
  }else if(typeof value==='object'){
    const r=normalizeRecord(value);
    if(r)out.push(r);
    Object.values(value).forEach(v=>{
      if(v&&typeof v==='object')findRecords(v,out,depth+1);
    });
  }
  return out;
}

async function getJSON(url){
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  return await res.json();
}

function addRecord(r){
  if(!r)return;
  const i=records.findIndex(x=>String(x.issue)===String(r.issue));
  if(i>=0)records[i]=r;
  else records.push(r);
}

function sortRecords(){
  records.sort((a,b)=>Number(b.issue)-Number(a.issue));
  records=records.slice(0,500);
}

function getTopPrediction(){
  const recent=records.slice(0,20);
  if(!recent.length)return null;
  const counts={};
  const lastSeen={};
  for(let n=1;n<=10;n++){counts[n]=0;lastSeen[n]=9999;}
  recent.forEach((r,index)=>{
    r.numbers.slice(0,3).forEach(n=>{
      counts[n]++;
      if(lastSeen[n]===9999)lastSeen[n]=index;
    });
  });
  const ranked=Array.from({length:10},(_,i)=>i+1);
  ranked.sort((a,b)=>{
    if(counts[b]!==counts[a])return counts[b]-counts[a];
    if(lastSeen[a]!==lastSeen[b])return lastSeen[a]-lastSeen[b];
    return a-b;
  });
  return {number:ranked[0],counts,periods:recent.length};
}

function autoSavePrediction(){
  const p=getTopPrediction();
  const el=document.getElementById('autoSaveStatus');
  if(!p||!nextIssue){
    el.textContent='等待开奖数据和下一期期号。';
    return;
  }
  const exists=predictions.some(x=>String(x.targetIssue)===String(nextIssue));
  if(exists){
    el.textContent='第 '+nextIssue+' 期预测已保存，不会重复保存。';
    return;
  }
  predictions.push({
    sourceIssue:latestIssue,
    targetIssue:nextIssue,
    number:p.number,
    time:new Date().toLocaleString()
  });
  save();
  el.textContent='已自动保存第 '+nextIssue+' 期预测。';
}

function render(){
  const latest=records[0];
  if(latest){
    document.getElementById('latest').innerHTML=
      '<div class="muted">已开奖期号：'+latest.issue+'</div>'+
      '<div class="numbers">'+latest.numbers.map((n,i)=>
        '<div class="num '+(i===0?'first':'')+'"><small>第'+(i+1)+'名</small>'+n+'</div>'
      ).join('')+'</div>';
  }

  const p=getTopPrediction();
  if(p){
    document.getElementById('prediction').innerHTML=
      '预测下一期：<strong class="gold" style="font-size:30px">'+p.number+'</strong>'+
      '<br>统计期数：'+p.periods+'期'+
      '<br>该数字近期前三名出现次数：'+p.counts[p.number]+'次';
  }

  // 历史开奖记录：只显示十个号码，用短横线连接
  document.getElementById('historyList').innerHTML=records.slice(0,20).map(r=>
    '<div class="history-item">'+
    '<div class="history-head">第 '+r.issue+' 期</div>'+
    '<div class="history-line">'+r.numbers.join('-')+'</div>'+
    '</div>'
  ).join('')||'<div class="empty">暂时没有历史记录</div>';

  let checked=0,hits=0;
  predictions.forEach(p=>{
    const r=records.find(x=>String(x.issue)===String(p.targetIssue));
    if(r){
      checked++;
      if(r.numbers.slice(0,3).includes(Number(p.number)))hits++;
    }
  });
  document.getElementById('hitCount').textContent=hits;
  document.getElementById('checkedCount').textContent=checked;
  document.getElementById('hitRate').textContent=checked?Math.round(hits/checked*100)+'%':'0%';

  document.getElementById('predictionList').innerHTML=
    predictions.slice().reverse().slice(0,50).map(p=>
      '<div class="history-item">目标期号：'+p.targetIssue+
      '　预测数字：<strong class="gold">'+p.number+'</strong>'+
      '<div class="muted">'+(p.time||'')+'</div></div>'
    ).join('')||'<div class="empty">暂无预测记录</div>';
}

async function refreshAll(){
  if(refreshing)return;
  refreshing=true;
  const status=document.getElementById('status');
  status.textContent='正在连接开奖数据……';

  try{
    const json=await getJSON(API+'?action=current');
    const draw=findDrawObject(json);
    if(!draw)throw new Error('没有找到开奖数据');

    const current=normalizeRecord(draw);
    if(!current)throw new Error('开奖数据格式无法识别');

    latestIssue=current.issue;
    nextIssue=String(draw.drawIssue??'');
    addRecord(current);

    status.innerHTML='<span class="green">连接成功</span> · 最新期号：'+current.issue+
      (nextIssue?' · 下一期期号：'+nextIssue:'');

    try{
      const date=draw.preDrawDate||new Date().toISOString().slice(0,10);
      const history=await getJSON(API+'?action=history&date='+encodeURIComponent(date));
      const found=findRecords(history);
      found.forEach(addRecord);
      document.getElementById('historyStatus').textContent=
        '历史接口读取到 '+found.length+' 条记录。';
    }catch(e){
      document.getElementById('historyStatus').textContent=
        '历史记录暂时无法读取，实时开奖不受影响。';
    }

    sortRecords();
    autoSavePrediction();
    save();
    render();
  }catch(e){
    status.innerHTML='<span class="red">连接失败：</span>'+String(e.message||e);
  }finally{
    refreshing=false;
  }
}

function exportData(){
  const data={records,predictions};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='极速赛车预测备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearPredictions(){
  if(!confirm('确定清空本机保存的预测记录吗？'))return;
  predictions=[];
  save();
  render();
  document.getElementById('autoSaveStatus').textContent='预测记录已清空。';
}

render();
refreshAll();
setInterval(refreshAll,30000);
</script>
</body>
</html>
