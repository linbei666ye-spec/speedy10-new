<script>
"use strict";

/* =========================
   数据接口
========================= */

const API =
"https://speedy10-data.lin-bei666ye.workers.dev/";

const HISTORY_API =
"https://speedy10-data.lin-bei666ye.workers.dev/?action=history&days=100";

const STORE = {
  history:"speedy10_history_v3",
  predictions:"speedy10_predictions_v3"
};

let draws = [];
let predictions = [];
let current = null;

let lastSyncTime = null;
let serverDeadline = 0;
let serverTimeAtSync = 0;
let localTimeAtSync = 0;

let normalRefreshTimer = null;
let countdownTimer = null;
let retryTimer = null;

let refreshing = false;
let zeroRefreshTriggered = false;
let retryingAfterZero = false;

/* =========================
   本地保存
========================= */

function load(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function save(){
  localStorage.setItem(STORE.history,JSON.stringify(draws));
  localStorage.setItem(STORE.predictions,JSON.stringify(predictions));
}

function hasAndroidBridge(){
  return !!(
    window.Android &&
    typeof window.Android.getPredictions === "function"
  );
}

function syncAndroidData(){
  try{
    if(!hasAndroidBridge()) return;

    const data = window.Android.getPredictions();

    if(data){
      const arr = typeof data === "string"
        ? JSON.parse(data)
        : data;

      if(Array.isArray(arr)){
        const merged = [...predictions];

        arr.forEach(item=>{
          if(item && item.issue){
            const exists = merged.some(
              p=>String(p.issue)===String(item.issue) &&
              p.system===item.system
            );
            if(!exists) merged.push(item);
          }
        });

        predictions = merged;
      }
    }
  }catch(e){
    console.log("Android同步失败",e);
  }
}

/* =========================
   工具函数
========================= */

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function pad(n){
  return String(n).padStart(2,"0");
}

function parseServerDate(value){
  if(!value) return 0;

  const str = String(value).trim();

  const normalized = str.includes("T")
    ? str
    : str.replace(" ","T");

  const time = new Date(normalized).getTime();

  return Number.isFinite(time) ? time : 0;
}

function normalizeNumbers(code){
  if(Array.isArray(code)){
    return code.map(Number).filter(n=>n>=1 && n<=10);
  }

  if(typeof code === "string"){
    return code
      .split(/[,，\s-]+/)
      .map(Number)
      .filter(n=>n>=1 && n<=10);
  }

  return [];
}

function normalizeDraw(item){
  if(!item || typeof item !== "object") return null;

  const issue =
    item.preDrawIssue ??
    item.issue ??
    item.drawIssue ??
    item.period ??
    item.issueNo;

  const code =
    item.preDrawCode ??
    item.drawCode ??
    item.code ??
    item.numbers ??
    item.result;

  const numbers = normalizeNumbers(code);

  if(issue == null || numbers.length < 10) return null;

  return {
    issue:String(issue),
    code:numbers.slice(0,10),
    time:item.preDrawTime ?? item.drawTime ?? item.time ?? ""
  };
}

/* =========================
   解析最新接口
========================= */

function unwrapLatest(j){
  const candidates=[
    j?.result?.data,
    j?.data?.result?.data,
    j?.result,
    j?.data,
    j
  ];

  for(const x of candidates){
    if(
      x &&
      x.preDrawIssue !== undefined &&
      x.preDrawCode !== undefined
    ){
      return x;
    }
  }

  return null;
}

function extractHistory(j){
  const candidates=[
    j?.result?.data?.list,
    j?.result?.data,
    j?.data?.list,
    j?.data?.result?.data?.list,
    j?.data?.result?.data,
    j?.data,
    j?.list
  ];

  for(const x of candidates){
    if(Array.isArray(x)){
      return x.map(normalizeDraw).filter(Boolean);
    }

    if(x && Array.isArray(x.list)){
      return x.list.map(normalizeDraw).filter(Boolean);
    }
  }

  return [];
}

function issueSort(a,b){
  const x = Number(a.issue);
  const y = Number(b.issue);

  if(Number.isFinite(x) && Number.isFinite(y)){
    return x-y;
  }

  return String(a.issue).localeCompare(String(b.issue));
}

function mergeDraws(oldList,newList){
  const map = new Map();

  [...oldList,...newList].forEach(item=>{
    if(item && item.issue){
      map.set(String(item.issue),item);
    }
  });

  return Array.from(map.values())
    .sort(issueSort)
    .slice(-3000);
}

async function fetchJSON(url){
  const response = await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("接口请求失败："+response.status);
  }

  return await response.json();
}

/* =========================
   倒计时同步
========================= */

function syncDrawClock(data){
  const serverTime = parseServerDate(data.serverTime);
  const drawTime = parseServerDate(data.drawTime);

  if(serverTime && drawTime){
    serverTimeAtSync = serverTime;
    serverDeadline = drawTime;
    localTimeAtSync = Date.now();

    zeroRefreshTriggered = false;
    retryingAfterZero = false;

    clearTimeout(retryTimer);
    retryTimer = null;
  }
}

function getEstimatedServerNow(){
  if(!serverTimeAtSync) return Date.now();

  return serverTimeAtSync +
    (Date.now()-localTimeAtSync);
}

function updateCountdown(){
  const timer = document.getElementById("timer");

  if(!serverDeadline){
    timer.textContent="--:--";
    return;
  }

  const remaining = serverDeadline-getEstimatedServerNow();

  if(remaining<=0){
    timer.textContent="00:00";

    if(!zeroRefreshTriggered){
      zeroRefreshTriggered=true;
      retryingAfterZero=true;

      document.getElementById("status").textContent =
        "倒计时结束，正在立即刷新开奖数据...";

      refreshAll(true);
    }

    return;
  }

  const seconds = Math.ceil(remaining/1000);

  const hours = Math.floor(seconds/3600);
  const minutes = Math.floor((seconds%3600)/60);
  const secs = seconds%60;

  timer.textContent = hours>0
    ? pad(hours)+":"+pad(minutes)+":"+pad(secs)
    : pad(minutes)+":"+pad(secs);
}

/* =========================
   预测算法
========================= */

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function median(arr){
  if(!arr.length) return 0;

  const sorted=[...arr].sort((a,b)=>a-b);
  const middle=Math.floor(sorted.length/2);

  return sorted.length%2
    ? sorted[middle]
    : (sorted[middle-1]+sorted[middle])/2;
}

function getPositionHistory(position,count=100){
  return draws
    .slice(-count)
    .map(d=>d.code[position-1])
    .filter(n=>n>=1 && n<=10);
}

function getRate(number,position,count=100){
  const list=getPositionHistory(position,count);

  if(!list.length) return 0;

  return list.filter(n=>n===number).length/list.length;
}

function getOmission(number,position){
  const list=getPositionHistory(position,draws.length);

  let omission=0;

  for(let i=list.length-1;i>=0;i--){
    if(list[i]===number) break;
    omission++;
  }

  return omission;
}

function scoreOneNumber(number,position,model){
  const recent=getPositionHistory(position,100);

  if(!recent.length) return 0;

  const short=recent.slice(-10);
  const middle=recent.slice(-30);
  const long=recent.slice(-80);

  const shortRate=short.filter(n=>n===number).length/
    Math.max(short.length,1);

  const middleRate=middle.filter(n=>n===number).length/
    Math.max(middle.length,1);

  const longRate=long.filter(n=>n===number).length/
    Math.max(long.length,1);

  const omission=getOmission(number,position);

  const omissionScore=clamp(omission/15,0,1);

  let trend=0;

  if(recent.length>=2){
    const last=recent.slice(-20);
    let same=0;

    for(let i=1;i<last.length;i++){
      if(last[i]===number) same++;
    }

    trend=same/Math.max(last.length-1,1);
  }

  switch(model){
    case "frequency":
      return shortRate*0.5+
        middleRate*0.3+
        longRate*0.2;

    case "omission":
      return omissionScore*0.7+
        middleRate*0.3;

    case "trend":
      return trend*0.65+
        shortRate*0.35;

    case "multi":
      return shortRate*0.25+
        middleRate*0.25+
        longRate*0.2+
        omissionScore*0.15+
        trend*0.15;

    case "cycle":
      return middleRate*0.5+
        Math.abs(shortRate-longRate)*0.5;

    case "transition":
      return shortRate*0.4+
        trend*0.4+
        middleRate*0.2;

    case "adaptive":
      return shortRate*0.35+
        middleRate*0.25+
        omissionScore*0.2+
        trend*0.2;

    default:
      return shortRate*0.3+
        middleRate*0.3+
        longRate*0.2+
        omissionScore*0.1+
        trend*0.1;
  }
}

const MODEL_KEYS=[
  "frequency",
  "omission",
  "trend",
  "multi",
  "cycle",
  "transition",
  "adaptive",
  "fusion"
];

const MODEL_NAMES={
  frequency:"近期冷热频率",
  omission:"遗漏与间隔",
  trend:"近期走势",
  multi:"多窗口融合",
  cycle:"周期相似分析",
  transition:"号码转移分析",
  adaptive:"自适应加权",
  fusion:"多模型动态融合"
};

function scoreNumbers(position,model){
  const scores=[];

  for(let n=1;n<=10;n++){
    let score;

    if(model==="fusion"){
      const parts=MODEL_KEYS
        .filter(k=>k!=="fusion")
        .map(k=>scoreOneNumber(n,position,k));

      score=parts.reduce((a,b)=>a+b,0)/parts.length;
    }else{
      score=scoreOneNumber(n,position,model);
    }

    scores.push({number:n,score});
  }

  return scores.sort((a,b)=>b.score-a.score);
}

function rankFor(position,model){
  return scoreNumbers(position,model)[0].number;
}

function chooseModel(position){
  if(draws.length<30) return "fusion";

  let bestModel="fusion";
  let bestScore=-1;

  MODEL_KEYS.forEach(model=>{
    let hit=0;
    let total=0;

    const start=Math.max(20,draws.length-40);

    for(let i=start;i<draws.length;i++){
      const history=draws.slice(0,i);

      if(history.length<20) continue;

      const saved=draws;
      draws=history;

      const predicted=rankFor(position,model);
      draws=saved;

      total++;

      if(draws[i].code[position-1]===predicted){
        hit++;
      }
    }

    const rate=total ? hit/total : 0;

    if(rate>bestScore){
      bestScore=rate;
      bestModel=model;
    }
  });

  return bestModel;
}

/* =========================
   四套预测系统
========================= */

function makePrediction(system,issue){
  if(draws.length<30) return null;

  if(system==="A"){
    const model=chooseModel(1);
    const number=rankFor(1,model);

    return {
      system,
      name:"系统A · 前三名",
      issue,
      number,
      positions:[1,2,3],
      model,
      status:"pending",
      createdAt:Date.now()
    };
  }

  if(system==="B"){
    const model=chooseModel(1);
    const number=rankFor(1,model);

    return {
      system,
      name:"系统B · 前七名",
      issue,
      number,
      positions:[1,2,3,4,5,6,7],
      model,
      status:"pending",
      createdAt:Date.now()
    };
  }

  if(system==="C"){
    const model=chooseModel(2);
    const number=rankFor(2,model);

    return {
      system,
      name:"系统C · 第2至第8名",
      issue,
      number,
      positions:[2,3,4,5,6,7,8],
      model,
      status:"pending",
      createdAt:Date.now()
    };
  }

  if(system==="D"){
    const choice=chooseNinePosition();

    return {
      system,
      name:"系统D · 指定名次九码",
      issue,
      position:choice.position,
      numbers:choice.numbers,
      excluded:choice.excluded,
      model:"nine",
      status:"pending",
      createdAt:Date.now()
    };
  }

  return null;
}

function chooseNinePosition(){
  let bestPosition=1;
  let bestExcluded=1;
  let bestCoverage=-1;

  for(let position=1;position<=10;position++){
    const scores=scoreNumbers(position,"fusion");

    const excluded=scores[scores.length-1].number;

    const coverage=1-getRate(excluded,position,100);

    if(coverage>bestCoverage){
      bestCoverage=coverage;
      bestPosition=position;
      bestExcluded=excluded;
    }
  }

  const numbers=[];

  for(let n=1;n<=10;n++){
    if(n!==bestExcluded) numbers.push(n);
  }

  return {
    position:bestPosition,
    excluded:bestExcluded,
    numbers
  };
}

function makeNextPredictions(issue){
  if(!issue || draws.length<30) return;

  const systems=["A","B","C","D"];

  systems.forEach(system=>{
    const exists=predictions.some(p=>
      String(p.issue)===String(issue) &&
      p.system===system
    );

    if(exists) return;

    const item=makePrediction(system,String(issue));

    if(item) predictions.unshift(item);
  });

  save();
}

/* =========================
   开奖自动结算
========================= */

function settlePredictions(){
  if(!draws.length) return;

  predictions.forEach(p=>{
    if(p.status!=="pending") return;

    const result=draws.find(d=>
      String(d.issue)===String(p.issue)
    );

    if(!result) return;

    let hit=false;

    if(p.system==="D"){
      const actual=result.code[p.position-1];

      hit=p.numbers.includes(actual);
      p.actual=actual;
    }else{
      hit=p.positions.some(position=>
        result.code[position-1]===p.number
      );
    }

    p.status=hit?"hit":"miss";
    p.settledAt=Date.now();
  });

  save();
}

/* =========================
   数据刷新
========================= */

async function refreshAll(fromCountdown=false){
  if(refreshing) return;

  refreshing=true;

  try{
    const results=await Promise.all([
      fetchJSON(API),
      fetchJSON(HISTORY_API).catch(()=>null)
    ]);

    const latest=unwrapLatest(results[0]);

    if(!latest){
      throw new Error("没有识别到最新开奖数据");
    }

    const previousIssue=current?.preDrawIssue
      ? String(current.preDrawIssue)
      : "";

    current=latest;

    syncDrawClock(current);

    const latestDraw=normalizeDraw({
      preDrawIssue:latest.preDrawIssue,
      preDrawCode:latest.preDrawCode,
      preDrawTime:latest.preDrawTime
    });

    let history=[];

    if(results[1]){
      history=extractHistory(results[1]);
    }

    if(latestDraw){
      history.push(latestDraw);
    }

    draws=mergeDraws(draws,history);

    syncAndroidData();

    settlePredictions();

    const nextIssue=String(
      current.drawIssue || ""
    );

    makeNextPredictions(nextIssue);

    save();

    lastSyncTime=new Date();

    document.getElementById("status").textContent =
      "数据同步成功 · "+lastSyncTime.toLocaleTimeString();

    renderAll();

    updateCountdown();

    if(fromCountdown){
      const newIssue=String(current.preDrawIssue || "");

      if(previousIssue && newIssue===previousIssue){
        retryingAfterZero=true;
        scheduleRetry();
      }else{
        retryingAfterZero=false;
      }
    }

  }catch(error){
    console.error(error);

    document.getElementById("status").textContent =
      "同步失败："+error.message;

    if(fromCountdown || retryingAfterZero){
      scheduleRetry();
    }

  }finally{
    refreshing=false;
  }
}

/* =========================
   倒计时结束后重试
========================= */

function scheduleRetry(){
  if(retryTimer) return;

  retryTimer=setTimeout(async()=>{
    retryTimer=null;

    await refreshAll(true);

  },5000);
}

/* =========================
   页面渲染
========================= */

function showPage(name,button){
  document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document.querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById("page-"+name)
    .classList.add("active");

  button.classList.add("active");
}

function numberHTML(number,position){
  let cls="number";

  if(position===1) cls+=" first";
  if(position===2) cls+=" second";
  if(position===3) cls+=" third";

  return `<span class="${cls}">${pad(number)}</span>`;
}

function renderLatest(){
  const issue=current?.preDrawIssue || "--";
  const time=current?.preDrawTime || "--";

  document.getElementById("latestIssue").textContent=
    "期号："+issue;

  document.getElementById("latestTime").textContent=
    "开奖时间："+time;

  document.getElementById("nextIssue").textContent=
    current?.drawIssue
      ? "下一期："+current.drawIssue
      : "等待下一期期号";

  const draw=draws.find(d=>
    String(d.issue)===String(issue)
  );

  if(!draw){
    document.getElementById("latestNumbers").textContent=
      "等待开奖数据...";
    return;
  }

  document.getElementById("latestNumbers").innerHTML=
    draw.code.map((n,i)=>numberHTML(n,i+1)).join("");
}

function renderPredictions(){
  document.getElementById("predictionIssue").textContent=
    "目标期号："+(current?.drawIssue || "--");

  const list=predictions.filter(p=>
    String(p.issue)===String(current?.drawIssue || "")
  );

  if(!list.length){
    document.getElementById("predictionList").innerHTML=
      '<div class="muted">历史数据达到30期后自动生成预测</div>';
    return;
  }

  document.getElementById("predictionList").innerHTML=
    list.map(p=>{
      const numberText=p.system==="D"
        ? p.numbers.map(n=>pad(n)).join("、")
        : pad(p.number);

      const extra=p.system==="D"
        ? `指定第${p.position}名，排除${pad(p.excluded)}`
        : `模型：${MODEL_NAMES[p.model] || p.model}`;

      return `
        <div class="item">
          <div class="row">
            <strong>${escapeHTML(p.name)}</strong>
            <span class="tag">${numberText}</span>
          </div>
          <div class="muted">${escapeHTML(extra)}</div>
          <div class="result yellow">待开奖</div>
        </div>
      `;
    }).join("");
}

function renderStats(){
  const settled=predictions.filter(p=>
    p.status==="hit" || p.status==="miss"
  );

  const hits=settled.filter(p=>p.status==="hit").length;
  const misses=settled.length-hits;

  const rate=settled.length
    ? (hits/settled.length*100).toFixed(1)
    : "0.0";

  document.getElementById("totalCount").textContent=
    settled.length;

  document.getElementById("hitCount").textContent=hits;
  document.getElementById("missCount").textContent=misses;
  document.getElementById("hitRate").textContent=rate+"%";
}

function renderHistory(){
  const list=draws.slice().reverse().slice(0,100);

  document.getElementById("historyList").innerHTML=
    list.map(d=>`
      <div class="item">
        <strong>${escapeHTML(d.issue)}</strong>
        <div style="margin-top:6px">
          ${d.code.map((n,i)=>numberHTML(n,i+1)).join("")}
        </div>
        <div class="muted">${escapeHTML(d.time || "")}</div>
      </div>
    `).join("") || "暂无开奖记录";
}

function renderAnalysis(){
  if(draws.length<10){
    document.getElementById("analysisList").textContent=
      "历史数据不足，正在收集数据...";
    return;
  }

  let html="";

  for(let position=1;position<=10;position++){
    const scores=scoreNumbers(position,"fusion");

    html+=`
      <div class="item">
        <strong>第${position}名</strong>
        <div style="margin-top:6px">
          ${scores.slice(0,3).map(x=>
            `<span class="number">${pad(x.number)}</span>`
          ).join("")}
        </div>
      </div>
    `;
  }

  document.getElementById("analysisList").innerHTML=html;
}

function renderArena(){
  let html="";

  MODEL_KEYS.forEach(model=>{
    const number=rankFor(1,model);

    html+=`
      <div class="item">
        <div class="row">
          <strong>${MODEL_NAMES[model]}</strong>
          ${numberHTML(number,0)}
        </div>
      </div>
    `;
  });

  document.getElementById("arenaList").innerHTML=
    html || "等待分析...";
}

function renderRecords(){
  if(!predictions.length){
    document.getElementById("recordList").textContent=
      "暂无预测记录";
    return;
  }

  document.getElementById("recordList").innerHTML=
    predictions.slice(0,300).map(p=>{
      let status="待开奖";
      let cls="yellow";

      if(p.status==="hit"){
        status="中";
        cls="green";
      }else if(p.status==="miss"){
        status="挂";
        cls="red";
      }

      const numberText=p.system==="D"
        ? p.numbers.map(n=>pad(n)).join("、")
        : pad(p.number);

      return `
        <div class="item">
          <div class="row">
            <strong>${escapeHTML(p.name)}</strong>
            <strong class="${cls}">${status}</strong>
          </div>
          <div class="muted">
            期号：${escapeHTML(p.issue)}
          </div>
          <div class="result">
            预测号码：${numberText}
          </div>
        </div>
      `;
    }).join("");
}

function renderAll(){
  renderLatest();
  renderPredictions();
  renderStats();
  renderHistory();
  renderAnalysis();
  renderArena();
  renderRecords();

  const syncText=lastSyncTime
    ? "最近同步："+lastSyncTime.toLocaleString()
    : "尚未完成同步";

  const backgroundText=hasAndroidBridge()
    ? "Android后台桥接已连接"
    : "当前网页未检测到Android后台桥接";

  document.getElementById("dataInfo").textContent=
    syncText+
    "；"+backgroundText+
    "；历史数据 "+draws.length+" 期"+
    "；自动刷新间隔30秒";
}

/* =========================
   清空预测记录
========================= */

function clearPredictions(){
  if(!confirm("确定清空网页保存的全部预测记录吗？")) return;

  predictions=[];

  save();
  renderAll();
}

/* =========================
   启动
========================= */

draws=load(STORE.history,[]);
predictions=load(STORE.predictions,[]);

if(!Array.isArray(draws)) draws=[];
if(!Array.isArray(predictions)) predictions=[];

renderAll();

/* 倒计时每秒更新 */
countdownTimer=setInterval(()=>{
  updateCountdown();
},1000);

/* 每30秒自动刷新 */
normalRefreshTimer=setInterval(()=>{
  refreshAll(false);
},30000);

/* 从后台返回页面时刷新 */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    refreshAll(false);
  }
});

window.addEventListener("pageshow",()=>{
  refreshAll(false);
});

/* 首次打开立即刷新 */
refreshAll(false);

</script>
</body>
</html>
