
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#101827">
<title>Speedy10 极速赛车预测</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#e8eef8;font-family:Arial,"Microsoft YaHei",sans-serif;padding:16px}
.wrap{max-width:760px;margin:auto}
h1{font-size:23px;text-align:center;margin:12px 0 20px}
h2{font-size:17px;margin:0 0 14px}
.card{background:#1b293d;border:1px solid #30415b;border-radius:13px;padding:16px;margin-bottom:14px}
.muted{color:#9aabc2;font-size:13px}
.status{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
button{border:0;border-radius:9px;padding:12px 18px;background:#20a56b;color:white;font-size:15px;font-weight:bold}
button:disabled{opacity:.5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.number{font-size:30px;font-weight:bold;color:#54dda0}
.predrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #30415b}
.predrow:last-child{border:0}
.draw{padding:12px 0;border-bottom:1px solid #30415b}
.draw:last-child{border:0}
.issue{font-size:13px;color:#9aabc2;margin-bottom:7px}
.code{font-size:17px;font-weight:bold;letter-spacing:.5px;overflow-wrap:anywhere}
.result{font-weight:bold}
.win{color:#54dda0}.lose{color:#ff8585}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #30415b}
.error{color:#ff9292}
.good{color:#54dda0}
</style>
</head>
<body>
<div class="wrap">
<h1>Speedy10 极速赛车预测</h1>

<div class="card">
  <h2>数据状态</h2>
  <div id="status" class="status">正在连接开奖服务器……</div>
  <div class="actions" style="margin-top:14px">
    <button id="refreshBtn" onclick="refreshAll()">刷新最新数据</button>
  </div>
  <p class="muted">数据来源：Speedy10 Data Worker</p>
</div>

<div class="card">
  <h2>最新开奖结果</h2>
  <div id="latest">等待读取数据……</div>
</div>

<div class="card">
  <h2>下一期预测</h2>
  <div id="predictions">正在分析……</div>
  <p class="muted">A：预测数字出现在前3名任意位置即命中。B：出现在前7名任意位置即命中。</p>
</div>

<div class="card">
  <h2>最近15期历史开奖记录</h2>
  <div id="history">正在读取历史数据……</div>
</div>

<div class="card">
  <h2>预测记录</h2>
  <div id="records"></div>
  <div class="actions" style="margin-top:12px">
    <button onclick="exportRecords()">导出预测记录</button>
  </div>
</div>

<div class="card">
  <h2>历史回测</h2>
  <div id="backtest" class="status">等待历史数据</div>
  <p class="muted">回测只使用每期开奖之前的数据，不使用未来开奖结果。历史表现不代表未来命中率。</p>
</div>
</div>

<script>
"use strict";

const API_BASE = "https://speedy10-data.lin-bei666ye.workers.dev/";
const HISTORY_URL = API_BASE + "?action=history&days=15";

const KEYS = {
  predictions: "speedy10_double_predA_v2",
  draws: "speedy10_history_v2"
};

let draws = [];
let predictions = [];
let currentData = null;
let busy = false;

function loadLocal(){
  try{draws=JSON.parse(localStorage.getItem(KEYS.draws)||"[]")}catch(e){draws=[]}
  try{predictions=JSON.parse(localStorage.getItem(KEYS.predictions)||"[]")}catch(e){predictions=[]}
  if(!Array.isArray(draws))draws=[];
  if(!Array.isArray(predictions))predictions=[];
}

function saveLocal(){
  localStorage.setItem(KEYS.draws,JSON.stringify(draws));
  localStorage.setItem(KEYS.predictions,JSON.stringify(predictions));
}

async function getJson(url){
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok)throw new Error("服务器 HTTP "+response.status);
  const data=await response.json();
  if(!data || typeof data!=="object")throw new Error("服务器返回的不是有效 JSON");
  if(data.errorCode!==undefined && Number(data.errorCode)!==0){
    throw new Error(data.message||"接口返回错误");
  }
  if(data.businessCode!==undefined && Number(data.businessCode)!==0){
    throw new Error(data.message||"业务接口返回错误");
  }
  return data;
}

function getPathObjects(root){
  const result=[];
  const seen=new Set();
  function walk(value,depth){
    if(!value || typeof value!=="object" || depth>8 || seen.has(value))return;
    seen.add(value);
    if(Array.isArray(value)){
      for(const item of value)walk(item,depth+1);
      return;
    }
    result.push(value);
    for(const key of Object.keys(value)){
      const child=value[key];
      if(child && typeof child==="object")walk(child,depth+1);
    }
  }
  walk(root,0);
  return result;
}

function readNumbers(value){
  if(Array.isArray(value)){
    const arr=value.map(x=>Number(x));
    if(arr.length===10 && arr.every(Number.isInteger))return arr;
  }
  if(typeof value==="string"){
    const parts=value.trim().split(/[,，\-、\s]+/).filter(Boolean);
    if(parts.length===10){
      const arr=parts.map(x=>Number(x));
      if(arr.every(Number.isInteger))return arr;
    }
  }
  return null;
}

function validNumbers(arr){
  if(!arr || arr.length!==10)return false;
  if(arr.some(n=>!Number.isInteger(n)||n<1||n>10))return false;
  return new Set(arr).size===10;
}

function normalizeDraw(obj){
  if(!obj || typeof obj!=="object")return null;

  const codeKeys=[
    "preDrawCode","drawCode","lotteryCode","openCode",
    "code","numbers","number","resultCode"
  ];

  let nums=null;
  for(const key of codeKeys){
    nums=readNumbers(obj[key]);
    if(nums)break;
  }

  if(!validNumbers(nums))return null;

  const issueKeys=[
    "preDrawIssue","drawIssue","issue","issueNo",
    "period","expect","lotteryIssue"
  ];
  let issue="";
  for(const key of issueKeys){
    if(obj[key]!==undefined && obj[key]!==null && String(obj[key]).trim()){
      issue=String(obj[key]).trim();
      break;
    }
  }

  const timeKeys=["preDrawTime","drawTime","time","date","preDrawDate"];
  let time="";
  for(const key of timeKeys){
    if(obj[key]){time=String(obj[key]);break}
  }

  return {issue,nums,time};
}

function extractDraws(data){
  const objects=getPathObjects(data);
  const found=[];
  const seen=new Set();

  for(const obj of objects){
    const draw=normalizeDraw(obj);
    if(!draw)continue;
    const key=(draw.issue||"无期号")+"_"+draw.nums.join("-");
    if(seen.has(key))continue;
    seen.add(key);
    found.push(draw);
  }

  return found;
}

function sortDraws(list){
  return list.sort((a,b)=>{
    if(a.issue && b.issue){
      const aa=Number(a.issue),bb=Number(b.issue);
      if(Number.isFinite(aa)&&Number.isFinite(bb))return aa-bb;
      return a.issue.localeCompare(b.issue);
    }
    return String(a.time||"").localeCompare(String(b.time||""));
  });
}

function mergeDraws(list){
  const map=new Map();
  for(const d of [...draws,...list]){
    if(!validNumbers(d.nums))continue;
    const key=d.issue ? "i:"+d.issue : "c:"+d.nums.join("-");
    map.set(key,d);
  }
  draws=sortDraws(Array.from(map.values()));
  saveLocal();
}

function fmtCode(nums){
  return nums.map(n=>String(n)).join("-");
}

function showStatus(message,type){
  const el=document.getElementById("status");
  el.textContent=message;
  el.className="status "+(type||"");
}

function showLatest(data){
  const el=document.getElementById("latest");
  if(!data){
    el.textContent="暂时没有最新开奖数据";
    return;
  }
  el.innerHTML=
    '<div class="issue">已开奖期号：'+escapeHtml(data.preDrawIssue||"未知")+'</div>'+
    '<div class="code">'+escapeHtml(fmtCode(data.nums))+'</div>'+
    '<p class="muted">开奖时间：'+escapeHtml(data.time||"接口未提供")+'</p>'+
    '<p class="muted">下一期期号：'+escapeHtml(data.nextIssue||"接口未提供")+'</p>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getFrequency(list){
  const count=Array(11).fill(0);
  for(const d of list)for(const n of d.nums)count[n]++;
  return count;
}

function getOmission(list){
  const result=Array(11).fill(list.length+1);
  for(let i=list.length-1,dist=0;i>=0;i--,dist++){
    for(const n of list[i].nums){
      if(result[n]===list.length+1)result[n]=dist;
    }
  }
  return result;
}

function scoreNumbers(list){
  const recent=list.slice(-30);
  const short=list.slice(-10);
  if(recent.length<5)throw new Error("有效历史开奖不足5期，暂时不能预测");

  const f30=getFrequency(recent);
  const f10=getFrequency(short);
  const omission=getOmission(recent);

  const scores=Array(11).fill(0);
  for(let n=1;n<=10;n++){
    const longRate=f30[n]/(recent.length*1);
    const shortRate=f10[n]/(short.length*1);
    const omit=omission[n];

    // 近期频率、短期变化与遗漏辅助评分
    scores[n]=
      longRate*0.45+
      shortRate*0.40+
      Math.min(omit,10)/10*0.15;
  }
  return scores;
}

function chooseNumber(scores,exclude){
  const candidates=[];
  for(let n=1;n<=10;n++){
    if(!exclude.includes(n))candidates.push({n,score:scores[n]});
  }
  candidates.sort((a,b)=>b.score-a.score);
  if(!candidates.length)return 1;

  // 分数接近时轮换选择，避免A、B永远输出相同号码
  const top=candidates.filter(x=>x.score>=candidates[0].score-0.000001);
  return top[Math.floor(Math.random()*top.length)].n;
}

function createPrediction(targetIssue){
  const last=draws[draws.length-1];
  if(!last || draws.length<5)return;

  const existing=predictions.find(p=>String(p.targetIssue)===String(targetIssue));
  if(existing)return;

  const scores=scoreNumbers(draws);
  const a=chooseNumber(scores,[]);
  const b=chooseNumber(scores,[a]);

  predictions.push({
    targetIssue:String(targetIssue||"待定"),
    baseIssue:String(last.issue||""),
    a,b,
    createdAt:new Date().toISOString(),
    statusA:"待开奖",
    statusB:"待开奖",
    actual:null
  });

  if(predictions.length>300)predictions=predictions.slice(-300);
  saveLocal();
}

function settlePredictions(latest){
  if(!latest || !latest.issue)return;
  let changed=false;

  for(const p of predictions){
    if(p.statusA!=="待开奖" && p.statusB!=="待开奖")continue;
    if(String(p.targetIssue)!==String(latest.issue))continue;

    p.actual=latest.nums.slice();
    p.statusA=latest.nums.slice(0,3).includes(Number(p.a))?"中":"挂";
    p.statusB=latest.nums.slice(0,7).includes(Number(p.b))?"中":"挂";
    p.settledAt=new Date().toISOString();
    changed=true;
  }
  if(changed)saveLocal();
}

function renderHistory(){
  const el=document.getElementById("history");
  const list=draws.slice(-15).reverse();
  if(!list.length){
    el.textContent="尚未读取到有效历史数据";
    return;
  }
  el.innerHTML=list.map(d=>
    '<div class="draw">'+
    '<div class="issue">期号：'+escapeHtml(d.issue||"未提供")+'</div>'+
    '<div class="code">'+escapeHtml(fmtCode(d.nums))+'</div>'+
    '</div>'
  ).join("");
}

function renderPredictions(){
  const el=document.getElementById("predictions");
  const p=predictions[predictions.length-1];
  if(!p){
    el.textContent="历史数据不足，暂时不能生成预测";
    return;
  }
  el.innerHTML=
    '<div class="predrow"><div><b>系统A · 前3名</b><div class="muted">目标期号：'+escapeHtml(p.targetIssue)+'</div></div><div class="number">'+p.a+'</div></div>'+
    '<div class="predrow"><div><b>系统B · 前7名</b><div class="muted">目标期号：'+escapeHtml(p.targetIssue)+'</div></div><div class="number">'+p.b+'</div></div>';
}

function renderRecords(){
  const el=document.getElementById("records");
  const list=predictions.slice(-20).reverse();
  if(!list.length){el.textContent="暂无预测记录";return}
  el.innerHTML=
    '<table><thead><tr><th>期号</th><th>A预测</th><th>A结果</th><th>B预测</th><th>B结果</th></tr></thead><tbody>'+
    list.map(p=>
      '<tr><td>'+escapeHtml(p.targetIssue)+'</td>'+
      '<td>'+p.a+'</td><td class="result '+(p.statusA==="中"?"win":p.statusA==="挂"?"lose":"")+'">'+p.statusA+'</td>'+
      '<td>'+p.b+'</td><td class="result '+(p.statusB==="中"?"win":p.statusB==="挂"?"lose":"")+'">'+p.statusB+'</td></tr>'
    ).join("")+
    '</tbody></table>';
}

function renderBacktest(){
  const el=document.getElementById("backtest");
  let aTotal=0,bTotal=0,aWin=0,bWin=0;
  for(let i=5;i<draws.length;i++){
    const past=draws.slice(0,i);
    const actual=draws[i].nums;
    try{
      const scores=scoreNumbers(past);
      const a=chooseNumber(scores,[]);
      const b=chooseNumber(scores,[a]);
      aTotal++;bTotal++;
      if(actual.slice(0,3).includes(a))aWin++;
      if(actual.slice(0,7).includes(b))bWin++;
    }catch(e){}
  }
  if(!aTotal){el.textContent="历史数据不足，暂时无法回测";return}
  el.textContent=
    "回测期数："+aTotal+
    "；系统A命中："+aWin+"次（"+(aWin/aTotal*100).toFixed(1)+"%）"+
    "；系统B命中："+bWin+"次（"+(bWin/bTotal*100).toFixed(1)+"%）";
}

function renderAll(){
  renderHistory();
  renderPredictions();
  renderRecords();
  renderBacktest();
}

async function refreshAll(){
  if(busy)return;
  busy=true;
  const btn=document.getElementById("refreshBtn");
  btn.disabled=true;
  showStatus("正在读取最新开奖和历史记录……");

  try{
    // 根地址返回最新一期数据
    const latestJson=await getJson(API_BASE);
    const objects=getPathObjects(latestJson);
    let current=null;
    let rawCurrent=null;

    for(const obj of objects){
      if(obj.preDrawCode && obj.preDrawIssue!==undefined){
        const normalized=normalizeDraw(obj);
        if(normalized){
          current=normalized;
          rawCurrent=obj;
          break;
        }
      }
    }

    if(!current)throw new Error("最新开奖接口中没有找到 preDrawIssue / preDrawCode");

    currentData={
      issue:current.issue,
      nums:current.nums,
      time:current.time,
      nextIssue:rawCurrent.drawIssue||""
    };

    // 读取最近历史数据
    let historyMessage="";
    try{
      const historyJson=await getJson(HISTORY_URL);
      const historyList=extractDraws(historyJson);
      if(historyList.length){
        mergeDraws(historyList);
        historyMessage="；历史接口识别到 "+historyList.length+" 条记录";
      }else{
        historyMessage="；历史接口有响应，但未识别到开奖记录";
      }
    }catch(historyError){
      historyMessage="；历史接口读取失败："+historyError.message;
    }

    // 把最新一期合并入历史记录
    mergeDraws([current]);
    settlePredictions(current);

    if(currentData.nextIssue){
      createPrediction(currentData.nextIssue);
    }

    showLatest(currentData);
    renderAll();

    const historyCount=draws.length;
    showStatus(
      "最新开奖读取成功，期号 "+current.issue+
      "；有效历史记录 "+historyCount+" 条"+historyMessage,
      "good"
    );

  }catch(error){
    showStatus("读取失败："+error.message+"。请检查 Worker 接口，不会用错误数据生成开奖记录。","error");
    document.getElementById("latest").textContent="暂时无法读取最新开奖";
  }finally{
    busy=false;
    btn.disabled=false;
  }
}

function exportRecords(){
  const data={
    predictions,
    draws:draws.slice(-15),
    exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="speedy10-records.json";
  a.click();
  URL.revokeObjectURL(url);
}

loadLocal();
renderAll();
refreshAll();
setInterval(refreshAll,30000);
</script>
</body>
</html>
