
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="./manifest.webmanifest">
<title>Speedy10 开奖预测助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#101827;color:#eef3ff;font-family:Arial,"Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:auto}
h1{text-align:center;color:#55d6ff;font-size:23px}
.card{background:#1b293d;border-radius:14px;padding:15px;margin:13px 0}
h2{font-size:18px;color:#63d9ff;margin:0 0 12px}
button{border:0;border-radius:9px;padding:11px 14px;background:#168bd0;color:white;font-size:14px}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:#aabbd2}
.status{color:#6ee7a5}
.error{color:#ff9292;overflow-wrap:anywhere}
.issue{text-align:center;color:#ffd45b;font-size:30px;font-weight:bold;padding:8px}
.balls{display:flex;justify-content:center;flex-wrap:wrap;gap:5px}
.ball{display:inline-flex;width:31px;height:31px;border-radius:50%;align-items:center;justify-content:center;background:#30445e;font-weight:bold}
.first{background:#f2b632;color:#171717}
.second{background:#c2cfdf;color:#171717}
.third{background:#bd8055;color:#171717}
.pick{display:inline-flex;align-items:center;justify-content:center;width:53px;height:53px;border-radius:50%;background:#f0bd3d;color:#161616;font-size:24px;font-weight:bold;margin:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 3px;border-bottom:1px solid #34445a;text-align:center}
th{color:#6edbff}
.good{color:#65efa1;font-weight:bold}
.bad{color:#ff9292;font-weight:bold}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.statgrid strong{display:block;font-size:25px;margin:5px}
textarea{width:100%;min-height:100px;margin:8px 0;padding:10px;border-radius:8px;background:#101827;color:white;border:1px solid #43536a}
</style>
</head>
<body>
<main class="wrap">
<h1>🚀 Speedy10 开奖预测助手</h1>
<p class="small" style="text-align:center">最近20期开奖 · 三个号码预测 · 自动成绩统计</p>

<section class="card">
<h2>📡 最新开奖</h2>
<div id="status">正在准备读取…</div>
<div class="small">最新期号</div>
<div id="issue" class="issue">--</div>
<div class="small">开奖号码（第一名特别标注）</div>
<div id="latest" class="balls">等待数据</div>
<p id="updated" class="small"></p>
<div class="buttons">
<button onclick="loadData()">🔄 刷新开奖记录</button>
<button onclick="window.open(SOURCE,'_blank')">打开开奖原网页</button>
</div>
</section>

<section class="card">
<h2>🎯 下一期预测</h2>
<div class="small">推荐三个不同数字；开奖前三名任意位置出现至少一个即算成功。</div>
<div id="picks" style="text-align:center">等待数据</div>
<p id="reason" class="small" style="text-align:center"></p>
<p id="pending" class="small"></p>
</section>

<section class="card">
<h2>🏆 预测成绩</h2>
<div class="statgrid">
<div><strong id="hits" class="good">0</strong><span class="small">成功次数</span></div>
<div><strong id="misses" class="bad">0</strong><span class="small">失败次数</span></div>
<div><strong id="rate">0%</strong><span class="small">成功率</span></div>
</div>
<p class="small" style="text-align:center">成功率 = 成功次数 ÷ 已核对预测总次数。</p>
<div id="history"></div>
<button onclick="clearStats()">清空预测统计</button>
</section>

<section class="card">
<h2>📜 最近20期开奖</h2>
<div id="records">等待数据</div>
</section>

<section class="card">
<h2>📝 手动导入备用</h2>
<p class="small">自动读取失败时，可粘贴开奖记录。每行格式：期号 + 10个号码，中间用空格隔开。</p>
<textarea id="manual" placeholder="34226995 3 7 6 10 4 8 9 5 1 2"></textarea>
<button onclick="importManual()">导入开奖记录</button>
</section>

<p class="small" style="text-align:center">预测仅供统计参考，不保证开奖结果。</p>
</main>

<script>
const SOURCE='https://speedylot88.com/speedy10-result.php';
const STORE='speedy10_prediction_v4';
let draws=[];
let saved=JSON.parse(localStorage.getItem(STORE)||'{"history":[],"pending":null}');
let history=Array.isArray(saved.history)?saved.history:[];
let pending=saved.pending||null;

function save(){
 localStorage.setItem(STORE,JSON.stringify({history,pending}));
}

function validDraw(issue,nums){
 return /^\d{7,9}$/.test(String(issue)) &&
 nums.length===10 &&
 nums.every(n=>Number.isInteger(n)&&n>=1&&n<=10) &&
 new Set(nums).size===10;
}

function parseData(raw){
 const doc=new DOMParser().parseFromString(raw,'text/html');
 const found=[];

 for(const tr of doc.querySelectorAll('tr')){
  const s=(tr.innerText||tr.textContent||'').replace(/\s+/g,' ').trim();
  const a=s.match(/\d+/g)||[];
  for(let i=0;i<a.length;i++){
   const issue=a[i];
   const nums=a.slice(i+1,i+11).map(Number);
   if(validDraw(issue,nums)){
    found.push({issue,nums});
    break;
   }
  }
 }

 const text=(doc.body?.innerText||doc.body?.textContent||raw)
  .replace(/[，,：:|]/g,' ')
  .replace(/\u00a0/g,' ');

 const lines=text.split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean);

 for(let i=0;i<lines.length;i++){
  const match=lines[i].match(/(?:期号\s*)?(\d{7,9})/);
  if(!match)continue;

  let nums=(lines[i].match(/\d{1,2}/g)||[])
   .map(Number).filter(n=>n>=1&&n<=10);

  for(let j=i+1;j<Math.min(i+18,lines.length)&&nums.length<10;j++){
   if(/\d{7,9}/.test(lines[j]))break;
   nums.push(...(lines[j].match(/\d{1,2}/g)||[])
    .map(Number).filter(n=>n>=1&&n<=10));
  }

  if(validDraw(match[1],nums.slice(0,10))){
   found.push({issue:match[1],nums:nums.slice(0,10)});
  }
 }

 const map=new Map();
 found.forEach(x=>map.set(x.issue,x));

 return [...map.values()].sort((a,b)=>Number(b.issue)-Number(a.issue));
}

async function fetchText(url){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),18000);

 try{
  const response=await fetch(url,{
   cache:'no-store',
   credentials:'omit',
   signal:controller.signal
  });

  if(!response.ok)throw new Error('HTTP '+response.status);
  return await response.text();

 }finally{
  clearTimeout(timer);
 }
}

async function fetchDraws(){
 const encoded=encodeURIComponent(SOURCE);

 const attempts=[
  {
   name:'Jina公开读取代理',
   url:'https://r.jina.ai/http://speedylot88.com/speedy10-result.php'
  },
  {
   name:'AllOrigins公开代理',
   url:'https://api.allorigins.win/raw?url='+encoded
  },
  {
   name:'Corsproxy公开代理',
   url:'https://corsproxy.io/?url='+encoded
  },
  {
   name:'开奖原网站',
   url:SOURCE
  }
 ];

 const errors=[];

 for(const item of attempts){
  try{
   const raw=await fetchText(item.url);
   const data=parseData(raw);

   if(data.length)return {data,source:item.name};

   errors.push(item.name+'：网页已返回，但没有识别到完整开奖数据');

  }catch(e){
   errors.push(item.name+'：'+
    (e.name==='AbortError'?'连接超时':e.message));
  }
 }

 throw new Error(errors.join('；'));
}

function predict(){
 const sample=draws.slice(0,50);
 if(!sample.length)return [];

 const score=Array(11).fill(0);

 sample.forEach((d,i)=>{
  d.nums.slice(0,3).forEach(n=>{
   score[n]+=1+(i<20?0.7:0);
  });
 });

 for(let n=1;n<=10;n++){
  const gap=sample.findIndex(d=>d.nums.slice(0,3).includes(n));
  score[n]+=Math.min(gap<0?sample.length:gap,15)*0.08;
 }

 return Array.from({length:10},(_,i)=>i+1)
  .sort((a,b)=>score[b]-score[a]||a-b)
  .slice(0,3);
}

function settle(){
 if(!pending||!draws.length)return;

 const target=draws.find(d=>Number(d.issue)>Number(pending.baseIssue));
 if(!target)return;

 if(history.some(h=>h.target===target.issue)){
  pending=null;
  save();
  return;
 }

 const top=target.nums.slice(0,3);
 const matched=pending.numbers.filter(n=>top.includes(n));

 history.unshift({
  target:target.issue,
  base:pending.baseIssue,
  numbers:pending.numbers,
  top3:top,
  result:matched.length?'成功':'失败',
  matched
 });

 history=history.slice(0,500);
 pending=null;
 save();
}

function ensurePending(){
 if(!pending&&draws.length){
  pending={
   baseIssue:draws[0].issue,
   numbers:predict()
  };
  save();
 }
}

function render(){
 if(!draws.length)return;

 const d=draws[0];

 document.getElementById('issue').textContent=d.issue;

 document.getElementById('latest').innerHTML=
  d.nums.map((n,i)=>
   '<span class="ball '+(i===0?'first':i===1?'second':i===2?'third':'')+'">'+n+'</span>'
  ).join('');

 document.getElementById('records').innerHTML=
  '<table><thead><tr><th>期号</th><th>第一名</th><th>其余号码</th></tr></thead><tbody>'+
  draws.slice(0,20).map(x=>
   '<tr><td>'+x.issue+'</td><td><span class="ball first">'+x.nums[0]+'</span></td><td>'+
   x.nums.slice(1).join(' · ')+'</td></tr>'
  ).join('')+
  '</tbody></table>';

 document.getElementById('picks').innerHTML=
  (pending?.numbers||[]).map(n=>'<span class="pick">'+n+'</span>').join('');

 document.getElementById('reason').textContent=
  '根据已读取记录中的前三名出现情况计算，仅供参考。';

 document.getElementById('pending').textContent=
  pending?'本组预测从第 '+pending.baseIssue+' 期之后开始核对。':'';

 renderStats();
}

function renderStats(){
 const h=history.filter(x=>x.result==='成功').length;
 const m=history.filter(x=>x.result==='失败').length;
 const t=h+m;

 document.getElementById('hits').textContent=h;
 document.getElementById('misses').textContent=m;
 document.getElementById('rate').textContent=
  (t?(h/t*100).toFixed(1):'0')+'%';

 document.getElementById('history').innerHTML=history.length?
  '<table><thead><tr><th>开奖期号</th><th>预测号码</th><th>实际前三名</th><th>结果</th></tr></thead><tbody>'+
  history.slice(0,30).map(x=>
   '<tr><td>'+x.target+'</td><td>'+x.numbers.join(',')+'</td><td>'+
   x.top3.join(',')+'</td><td class="'+
   (x.result==='成功'?'good':'bad')+'">'+x.result+'</td></tr>'
  ).join('')+
  '</tbody></table>':
  '<p class="small">暂无已核对成绩。首次预测要等下一期开奖后才会计入统计。</p>';
}

async function loadData(){
 const s=document.getElementById('status');
 s.className='';
 s.textContent='正在依次尝试公开代理读取…';

 try{
  const result=await fetchDraws();
  draws=result.data;

  settle();
  ensurePending();

  s.className='status';
  s.textContent='读取成功：'+result.source+
   '，识别到 '+draws.length+' 期；显示最近20期。';

  document.getElementById('updated').textContent=
   '更新时间：'+new Date().toLocaleString();

  render();

 }catch(e){
  s.className='error';
  s.textContent='自动读取失败：'+e.message+
   '。可重试，或使用下方手动导入。';
  renderStats();
 }
}

function importManual(){
 const arr=[];

 for(const line of document.getElementById('manual').value.split(/[\r\n]+/)){
  const a=(line.match(/\d+/g)||[]).map(Number);

  if(a.length>=11&&validDraw(String(a[0]),a.slice(1,11))){
   arr.push({issue:String(a[0]),nums:a.slice(1,11)});
  }
 }

 if(!arr.length){
  alert('没有识别到数据。每行请按“期号 空格 号码1 … 号码10”输入。');
  return;
 }

 draws=arr.sort((a,b)=>Number(b.issue)-Number(a.issue));
 settle();
 ensurePending();

 document.getElementById('status').className='status';
 document.getElementById('status').textContent='已手动导入 '+draws.length+' 期';

 render();
}

function clearStats(){
 if(!confirm('确定清空本设备保存的预测成绩和待核对预测吗？'))return;

 history=[];
 pending=null;
 save();
 ensurePending();
 renderStats();
 render();
}

if('serviceWorker'in navigator){
 addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 });
}

loadData();
</script>
</body>
</html>
