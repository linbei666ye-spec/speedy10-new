<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>极速赛车数据分析助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#101827;color:#edf2f7;font-family:Arial,"Microsoft YaHei",sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;font-size:23px;color:#facc15}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin-bottom:18px}
.card{background:#1b293b;border:1px solid #304158;border-radius:13px;padding:14px;margin-bottom:13px}
h2{font-size:17px;margin:0 0 12px}
.status,.muted,.notice{font-size:12px;color:#a5b4c8;line-height:1.8}
.green{color:#4ade80}.gold{color:#facc15}.red{color:#f87171}
.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.num{background:#26374e;border-radius:9px;text-align:center;padding:12px 2px;font-size:20px;font-weight:bold}
.num.first{background:#facc15;color:#241b00}
.num small{display:block;font-size:10px;font-weight:normal;margin-bottom:4px}
button{border:0;border-radius:9px;padding:12px 14px;font-size:14px;font-weight:bold;background:#3b82f6;color:white;margin:7px 3px 0 0}
button.secondary{background:#475569}
button.danger{background:#b45353}
button.active{background:#facc15;color:#241b00}
.history-item{padding:12px 0;border-bottom:1px solid #34445a}
.history-head{font-size:12px;color:#94a3b8;margin-bottom:7px}
.history-line{font-size:19px;font-weight:bold;letter-spacing:1px;word-break:break-word}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#26374e;padding:12px 4px;border-radius:9px}
.stat strong{display:block;font-size:23px;color:#facc15}
.stat span{font-size:11px;color:#a5b4c8}
.empty{color:#94a3b8;font-size:13px;padding:10px 0}
select{width:100%;padding:12px;margin:10px 0;background:#26374e;color:white;border-radius:8px;border:1px solid #475569}
.page{display:none}.page.show{display:block}
</style>
</head>
<body>
<div class="container">
<h1>极速赛车数据分析助手</h1>
<div class="sub">实时开奖 · 历史记录 · 数字统计</div>

<div class="card">
<h2>分析功能切换</h2>
<button id="tabThree" class="active" onclick="showPage('three')">前三名分析</button>
<button id="tabFirst" class="secondary" onclick="showPage('first')">第一名 TOP 7</button>
</div>

<div class="card">
<h2>实时开奖数据</h2>
<div class="status" id="status">正在连接开奖数据……</div>
<div id="latest"></div>
<button onclick="refreshAll()">立即刷新</button>
<button class="secondary" onclick="openSource()">打开最新开奖网站</button>
</div>

<div class="page show" id="threePage">
<div class="card">
<h2>前三名数字历史频次</h2>
<div class="muted">统计数字在每期前三名出现的次数。</div>
<select id="periodSelect" onchange="renderStats()">
<option value="10">最近10期</option>
<option value="20" selected>最近20期</option>
<option value="30">最近30期</option>
<option value="40">最近40期</option>
<option value="50">最近50期</option>
</select>
<div class="stats" id="stats"></div>
</div>
</div>

<div class="page" id="firstPage">
<div class="card">
<h2>第一名历史数字 TOP 7</h2>
<div class="muted">根据已开奖历史数据统计第一名出现次数最多的7个数字。</div>
<select id="firstPeriod" onchange="renderFirstTop7()">
<option value="10">最近10期</option>
<option value="20" selected>最近20期</option>
<option value="30">最近30期</option>
<option value="40">最近40期</option>
<option value="50">最近50期</option>
</select>
<div id="firstTop7"></div>
</div>

<div class="card">
<h2>每期 TOP 7 历史参考核对</h2>
<div class="muted">保存每次统计时的 TOP 7，开奖后核对实际第一名是否在其中。</div>
<div id="auditSummary"></div>
<div id="auditList"></div>
</div>
</div>

<div class="card">
<h2>历史开奖记录</h2>
<div class="muted" id="historyStatus">等待获取历史数据……</div>
<div id="historyList"></div>
</div>

<div class="card">
<h2>数据管理</h2>
<button class="secondary" onclick="exportData()">导出数据备份</button>
<button class="secondary" onclick="document.getElementById('importFile').click()">导入数据备份</button>
<input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)">
<button class="danger" onclick="clearRecords()">清空本机开奖记录</button>
<div class="notice">数据保存在本机浏览器，建议定期导出备份。</div>
</div>
</div>

<script>
const SOURCE_URL='https://m.1689687.com/html/public/home.html';
const API='https://speedy10-data.lin-bei666ye.workers.dev/';
const STORAGE_KEY='speedy10_records_v8';
const AUDIT_KEY='speedy10_audit_v1';

let records=loadJSON(STORAGE_KEY,[]);
let audits=loadJSON(AUDIT_KEY,[]);
let refreshing=false;

function loadJSON(key,fallback){
 try{
  const x=JSON.parse(localStorage.getItem(key));
  return x===null?fallback:x;
 }catch(e){return fallback}
}
function saveAll(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
 localStorage.setItem(AUDIT_KEY,JSON.stringify(audits));
}
function showPage(page){
 document.getElementById('threePage').classList.toggle('show',page==='three');
 document.getElementById('firstPage').classList.toggle('show',page==='first');
 document.getElementById('tabThree').className=page==='three'?'active':'secondary';
 document.getElementById('tabFirst').className=page==='first'?'active':'secondary';
}
function openSource(){window.open(SOURCE_URL,'_blank','noopener')}
function normalizeRecord(obj){
 if(!obj||typeof obj!=='object')return null;
 const issue=obj.preDrawIssue??obj.issue??obj.drawIssue??obj.period??obj.expect;
 const code=obj.preDrawCode??obj.drawCode??obj.openCode??obj.code??obj.numbers;
 if(issue===undefined||code===undefined)return null;
 const nums=Array.isArray(code)?code.map(Number):String(code).split(/[,，\s-]+/).map(Number);
 if(nums.length!==10||nums.some(n=>!Number.isInteger(n)||n<1||n>10))return null;
 return {issue:String(issue),numbers:nums};
}
function findRecords(value,out=[],depth=0){
 if(depth>10||value==null)return out;
 if(Array.isArray(value))value.forEach(v=>findRecords(v,out,depth+1));
 else if(typeof value==='object'){
  const r=normalizeRecord(value);
  if(r)out.push(r);
  Object.values(value).forEach(v=>{
   if(v&&typeof v==='object')findRecords(v,out,depth+1);
  });
 }
 return out;
}
function findCurrent(value,depth=0){
 if(depth>10||!value||typeof value!=='object')return null;
 if(!Array.isArray(value)&&value.preDrawIssue!==undefined&&value.preDrawCode)return value;
 for(const v of Object.values(value)){
  const found=findCurrent(v,depth+1);
  if(found)return found;
 }
 return null;
}
async function getJSON(url){
 const response=await fetch(url,{cache:'no-store'});
 if(!response.ok)throw new Error('HTTP '+response.status);
 return response.json();
}
function addRecord(r){
 const i=records.findIndex(x=>String(x.issue)===String(r.issue));
 if(i>=0)records[i]=r;
 else{
  records.push(r);
  auditPrevious(r);
 }
}
function sortRecords(){
 records.sort((a,b)=>Number(b.issue)-Number(a.issue));
 records=records.slice(0,500);
}
function getTop7(source){
 const counts=Array(11).fill(0);
 source.forEach(r=>{
  const n=Number(r.numbers?.[0]);
  if(n>=1&&n<=10)counts[n]++;
 });
 return Array.from({length:10},(_,i)=>i+1)
  .sort((a,b)=>counts[b]-counts[a]||a-b)
  .slice(0,7);
}
function auditPrevious(newRecord){
 const previous=audits.find(a=>a.issue===String(newRecord.issue));
 if(previous)return;
 const old=records.filter(r=>r.issue!==newRecord.issue);
 if(!old.length)return;
 const top7=getTop7(old.slice(0,20));
 audits.push({
  issue:String(newRecord.issue),
  reference:top7,
  actual:Number(newRecord.numbers[0]),
  result:top7.includes(Number(newRecord.numbers[0]))?'符合':'未符合',
  checkedAt:new Date().toISOString()
 });
}
async function refreshAll(){
 if(refreshing)return;
 refreshing=true;
 const status=document.getElementById('status');
 status.textContent='正在刷新……';
 try{
  const data=await getJSON(API+'?action=current');
  const draw=findCurrent(data);
  if(!draw)throw new Error('未找到最新开奖数据');
  const current=normalizeRecord(draw);
  if(!current)throw new Error('开奖数据格式无法识别');
  addRecord(current);
  try{
   const date=draw.preDrawDate||new Date().toISOString().slice(0,10);
   const history=await getJSON(API+'?action=history&date='+encodeURIComponent(date));
   const list=findRecords(history);
   list.forEach(addRecord);
   document.getElementById('historyStatus').textContent='历史接口读取到 '+list.length+' 条记录。';
  }catch(e){
   document.getElementById('historyStatus').textContent='历史接口暂时无法读取，保留已有记录。';
  }
  sortRecords();
  saveAll();
  status.innerHTML='<span class="green">连接成功</span> · 最新期号：'+current.issue;
  render();
 }catch(e){
  status.textContent='连接失败：'+String(e.message||e);
 }finally{refreshing=false}
}
function render(){
 const latest=records[0];
 document.getElementById('latest').innerHTML=latest
 ?'<div class="muted">最新期号：'+latest.issue+'</div>'+
  '<div class="numbers">'+latest.numbers.map((n,i)=>
   '<div class="num '+(i===0?'first':'')+'"><small>第'+(i+1)+'名</small>'+n+'</div>'
  ).join('')+'</div>'
 :'<div class="empty">暂无开奖数据</div>';
 document.getElementById('historyList').innerHTML=
  records.slice(0,20).map(r=>
   '<div class="history-item"><div class="history-head">第 '+r.issue+' 期</div>'+
   '<div class="history-line">'+r.numbers.join('-')+'</div></div>'
  ).join('')||'<div class="empty">暂无历史记录</div>';
 renderStats();
 renderFirstTop7();
 renderAudit();
}
function renderStats(){
 const period=Number(document.getElementById('periodSelect').value);
 const recent=records.slice(0,period);
 const counts=Array(11).fill(0);
 recent.forEach(r=>r.numbers.slice(0,3).forEach(n=>counts[n]++));
 document.getElementById('stats').innerHTML=
  Array.from({length:10},(_,i)=>i+1).map(n=>
   '<div class="stat"><strong>'+counts[n]+'</strong><span>数字 '+n+'</span></div>'
  ).join('');
}
function renderFirstTop7(){
 const period=Number(document.getElementById('firstPeriod').value);
 const recent=records.slice(0,period);
 const counts=Array(11).fill(0);
 recent.forEach(r=>{
  const n=Number(r.numbers[0]);
  if(n>=1&&n<=10)counts[n]++;
 });
 const ranked=Array.from({length:10},(_,i)=>i+1)
  .sort((a,b)=>counts[b]-counts[a]||a-b).slice(0,7);
 document.getElementById('firstTop7').innerHTML=
  ranked.map((n,i)=>
   '<div class="history-item"><strong class="gold">第 '+(i+1)+' 名：</strong>'+
   '数字 '+n+'　出现 '+counts[n]+' 次</div>'
  ).join('')||'<div class="empty">暂无数据</div>';
}
function renderAudit(){
 const checked=audits.filter(a=>a.result);
 const yes=checked.filter(a=>a.result==='符合').length;
 const no=checked.length-yes;
 document.getElementById('auditSummary').innerHTML=
  '<div class="stats"><div class="stat"><strong>'+checked.length+'</strong><span>已核对期数</span></div>'+
  '<div class="stat"><strong class="green">'+yes+'</strong><span>符合</span></div>'+
  '<div class="stat"><strong class="red">'+no+'</strong><span>未符合</span></div></div>';
 document.getElementById('auditList').innerHTML=
  audits.slice().reverse().slice(0,50).map(a=>
   '<div class="history-item"><div class="history-head">第 '+a.issue+' 期</div>'+
   '<div>参考数字：'+a.reference.join('、')+'</div>'+
   '<div>实际第一名：'+a.actual+'</div>'+
   '<strong class="'+(a.result==='符合'?'green':'red')+'">'+a.result+'</strong></div>'
  ).join('')||'<div class="empty">暂无核对记录，新数据到来后自动建立记录。</div>';
}
function exportData(){
 const blob=new Blob([JSON.stringify({records,audits},null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='极速赛车数据备份.json';a.click();
 URL.revokeObjectURL(url);
}
function importData(event){
 const file=event.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!Array.isArray(data.records))throw new Error('备份文件格式不正确');
   records=data.records;
   audits=Array.isArray(data.audits)?data.audits:[];
   sortRecords();saveAll();render();
   alert('数据导入成功');
  }catch(e){alert('导入失败：'+e.message)}
  event.target.value='';
 };
 reader.readAsText(file);
}
function clearRecords(){
 if(!confirm('确定清空本机保存的开奖记录和核对记录吗？'))return;
 records=[];audits=[];saveAll();render();
}
render();
refreshAll();
setInterval(refreshAll,30000);
</script>
</body>
</html>
